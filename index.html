<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Distribuidora Horizonte — Proposta de Consultoria em TI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070B16; --bg2:#0C1324; --ink:#EAF0FF; --mute:#8D9AB8; --line:rgba(150,170,220,.16);
  --glass:rgba(12,19,36,.78); --orange:#FF8A3D; --teal:#2EC4B6; --red:#FF4D5E; --green:#5BD68A; --blue:#4C8DFF; --violet:#B48CFF; --yellow:#FFC94D;
  --panelW:min(460px,40vw);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block}
#labels{position:fixed;inset:0;pointer-events:none}
#fade{position:fixed;inset:0;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .35s}
#fade.on{opacity:.85}
button{font:inherit;color:inherit;cursor:pointer}

/* topo */
#top{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:18px;padding:0 18px;z-index:20;
  background:linear-gradient(to bottom,rgba(7,11,22,.92),rgba(7,11,22,0))}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;font-family:"Space Grotesk";color:var(--ink);letter-spacing:.2px;white-space:nowrap}
.brand b{font-weight:700}
#chapter{flex:1;font-family:"Space Grotesk";font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chapter b{color:var(--orange);font-weight:600}
.tools{display:flex;gap:8px}
.pill{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;transition:.2s}
.pill:hover,.pill.on{border-color:var(--orange);background:rgba(255,138,61,.12)}
.pill.icon{padding:6px 11px}
.muted{color:var(--mute)}
#clock{font-family:"JetBrains Mono";font-size:12.5px}
#btnTimer.over #clock{color:var(--red)}

/* painel */
#panel{position:fixed;left:18px;top:68px;bottom:84px;width:var(--panelW);z-index:15;pointer-events:none;display:flex;flex-direction:column}
#panelInner{pointer-events:auto;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);
  border-radius:18px;padding:22px 24px;overflow:auto;max-height:100%;box-shadow:0 20px 60px rgba(0,0,0,.45);
  transform:translateX(0);opacity:1;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .35s}
#panelInner.out{transform:translateX(-30px);opacity:0}
#panelInner::-webkit-scrollbar{width:8px}#panelInner::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px}
#panel.cover{left:50%;transform:translateX(-50%);width:min(760px,92vw);top:auto;bottom:110px}
#panel.cover #panelInner{text-align:center;background:rgba(7,11,22,.55)}
.kicker{font-family:"Space Grotesk";font-size:12px;letter-spacing:2.4px;text-transform:uppercase;color:var(--orange);margin-bottom:6px;font-weight:600}
h1{font-family:"Space Grotesk";font-size:clamp(30px,4.2vw,54px);line-height:1.03;margin:.1em 0 .25em;letter-spacing:-1px}
h2{font-family:"Space Grotesk";font-size:27px;line-height:1.1;margin:0 0 10px;letter-spacing:-.4px}
h3{font-family:"Space Grotesk";font-size:16px;margin:16px 0 6px}
p{margin:0 0 10px;color:#C8D2EA}
.lead{font-size:16px;color:#D6DEF2}
.small{font-size:12.5px;color:var(--mute)}
a{color:#8FB6FF}
.hl{color:var(--orange)} .hl-t{color:var(--teal)} .hl-r{color:var(--red)} .hl-g{color:var(--green)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:8px 13px;font-size:13.5px;transition:.2s}
.btn:hover{border-color:var(--orange)}
.btn.on{background:var(--orange);border-color:var(--orange);color:#160A02;font-weight:600}
.btn.primary{background:var(--orange);color:#160A02;border-color:var(--orange);font-weight:600}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;padding:7px 11px;font-size:13px;color:var(--mute);white-space:nowrap}
.seg button.on{background:rgba(255,138,61,.18);color:var(--ink)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.card{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;transition:.2s;text-align:left}
.card:hover,.card.on{border-color:var(--orange);background:rgba(255,138,61,.08)}
.card .t{font-weight:600;font-size:13.5px;font-family:"Space Grotesk"}
.card .s{font-size:12px;color:var(--mute)}
.stat{display:flex;flex-direction:column;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.stat b{font-family:"Space Grotesk";font-size:19px;letter-spacing:-.4px;white-space:nowrap}
.stat span{font-size:12px;color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.detail{margin-top:12px;border-top:1px solid var(--line);padding-top:12px;animation:rise .35s ease}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.detail dl{margin:0;display:grid;grid-template-columns:96px 1fr;gap:6px 10px;font-size:13.5px}
.detail dt{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:1px;padding-top:2px}
.detail dd{margin:0;color:#D6DEF2}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid currentColor;margin-right:4px;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-weight:600;color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.8px;padding:6px 6px;border-bottom:1px solid var(--line);position:sticky;top:-22px;background:#0D1428}
td{padding:7px 6px;border-bottom:1px solid rgba(150,170,220,.08);vertical-align:top}
td.n,th.n{text-align:right;font-family:"JetBrains Mono";font-size:11.5px;white-space:nowrap}
tr.sub td{font-weight:600;color:var(--ink);background:rgba(255,255,255,.03)}
tr.tot td{font-weight:700;color:var(--orange);border-top:1px solid var(--orange)}
.tabs{display:flex;gap:4px;margin:8px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;padding:8px 10px;color:var(--mute);border-bottom:2px solid transparent;font-size:13.5px}
.tabs button.on{color:var(--ink);border-color:var(--orange)}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.07);overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--orange));border-radius:8px;transition:width .8s}
.acc{border:1px solid var(--line);border-radius:12px;margin:6px 0;overflow:hidden}
.acc summary{padding:10px 12px;cursor:pointer;font-weight:600;font-size:13.5px;list-style:none}
.acc summary::after{content:"+";float:right;color:var(--orange)}
.acc[open] summary::after{content:"–"}
.acc div{padding:0 12px 12px;color:#C8D2EA;font-size:13.5px}
.steps{list-style:none;padding:0;margin:10px 0;counter-reset:s}
.steps li{position:relative;padding:7px 8px 7px 36px;border-radius:10px;margin:3px 0;font-size:13.5px;color:var(--mute);transition:.3s}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:8px;top:7px;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);font-size:11px;display:grid;place-items:center}
.steps li.on{background:rgba(46,196,182,.12);color:var(--ink)}
.steps li.on::before{background:var(--teal);color:#04201D;border-color:var(--teal)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin:6px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:16px;display:flex;justify-content:center;align-items:center;gap:10px;z-index:20;pointer-events:none}
#nav>*{pointer-events:auto}
.navbtn{width:40px;height:40px;border-radius:50%;background:var(--glass);border:1px solid var(--line);font-size:22px;line-height:1;display:grid;place-items:center;backdrop-filter:blur(10px)}
.navbtn:hover{border-color:var(--orange)}
#dots{display:flex;gap:4px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 8px;backdrop-filter:blur(10px)}
.dot{position:relative;height:26px;min-width:26px;border-radius:999px;border:0;background:transparent;color:var(--mute);font:600 11px "Space Grotesk";padding:0 7px}
.dot:hover{color:var(--ink);background:rgba(255,255,255,.06)}
.dot.on{background:var(--orange);color:#160A02}
.dot .tip{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#111A31;border:1px solid var(--line);padding:4px 8px;border-radius:8px;font:500 12px Inter;color:var(--ink);opacity:0;pointer-events:none;transition:.15s}
.dot:hover .tip{opacity:1}
.dot.sep{margin-left:6px}
#hint{position:fixed;right:18px;bottom:26px;font-size:12px;color:var(--mute);z-index:10;pointer-events:none}

/* labels 3D */
.lbl{position:absolute;transform:translate(-50%,-50%);font:600 12px "Space Grotesk";color:var(--ink);background:rgba(7,11,22,.72);border:1px solid var(--line);padding:3px 8px;border-radius:8px;white-space:nowrap;pointer-events:none;transition:opacity .3s}
.lbl.sm{font-size:10.5px;padding:2px 6px;color:#C8D2EA}
.lbl.big{font-size:15px;padding:5px 11px}
.lbl.room{background:transparent;border:0;color:rgba(234,240,255,.75);font-size:11px;letter-spacing:1.5px;text-transform:uppercase}
.lbl.click{pointer-events:auto;cursor:pointer}
.lbl.click:hover{border-color:var(--orange)}
#tooltip{position:fixed;z-index:40;pointer-events:none;background:#111A31;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;max-width:280px;opacity:0;transition:opacity .15s;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#tooltip.on{opacity:1}
#tooltip b{font-family:"Space Grotesk"}

#notes{position:fixed;right:18px;top:68px;width:min(360px,30vw);z-index:25;background:#FFF7EE;color:#2A1A0A;border-radius:14px;padding:14px 16px;box-shadow:0 20px 50px rgba(0,0,0,.5);font-size:14px}
.notes-h{font:700 11px "Space Grotesk";letter-spacing:2px;text-transform:uppercase;color:#C2551A;margin-bottom:6px}

#modal{position:fixed;inset:0;z-index:50;background:rgba(3,6,12,.7);display:grid;place-items:center;backdrop-filter:blur(4px)}
#modal[hidden]{display:none}
.modal-card{position:relative;width:min(820px,92vw);max-height:82vh;overflow:auto;background:#0D1428;border:1px solid var(--line);border-radius:18px;padding:24px 26px}
.modal-x{position:absolute;right:14px;top:10px;background:none;border:0;font-size:26px;color:var(--mute)}
#loading{position:fixed;inset:0;z-index:60;display:grid;place-content:center;justify-items:center;gap:14px;background:var(--bg);color:var(--mute);transition:opacity .6s}
#loading.done{opacity:0;pointer-events:none}
.ld-sun{width:56px;height:28px;border-radius:56px 56px 0 0;background:var(--orange);box-shadow:0 0 40px var(--orange);animation:sun 1.4s ease-in-out infinite alternate}
@keyframes sun{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}
.err{color:var(--red)}

@media (max-width:820px){
  :root{--panelW:auto}
  #panel{left:10px;right:10px;top:auto;bottom:66px;max-height:46vh;width:auto}
  #panel.cover{bottom:70px}
  #chapter,#hint,.brand span,#btnTimer .muted,#btnSources{display:none}
  .pill{padding:5px 10px}
  #dots .dot:not(.on){min-width:18px;padding:0 4px}
  #notes{width:auto;left:10px;right:10px}
  .cards{grid-template-columns:1fr}
}
.lbl.room.focus{color:#FF8A3D;font-size:14px;font-weight:700}
.lbl.val{transform:translate(-50%,-100%);background:none;border:0;font:700 15px "Space Grotesk";text-shadow:0 2px 8px #000;white-space:nowrap}
.lbl.val .rk{display:inline-block;font-size:10.5px;background:#FF8A3D;color:#160A02;border-radius:6px;padding:1px 5px;margin-right:5px;vertical-align:2px}
.lbl.barname{transform:translate(-50%,0);background:none;border:0;font:500 11px/1.25 Inter;color:#D6DEF2;text-align:center;white-space:normal;width:104px;text-shadow:0 1px 4px #000}
.lbl.barname .muted{font-size:10px}

#chapter .presenter{color:#2EC4B6;letter-spacing:1px}
.notes-who{font:600 12.5px Inter;color:#2A1A0A;background:#FFE2C8;border-radius:8px;padding:4px 8px;margin-bottom:8px;display:inline-block}

</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",

<body>

<div id="labels"></div>
<div id="fade"></div>

<header id="top">
  <div class="brand" data-go="0" title="Voltar à capa">
    <svg viewBox="0 0 40 24" width="34" height="20" aria-hidden="true"><path d="M2 20h36" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><path d="M8 20a12 12 0 0 1 24 0" fill="none" stroke="#FF8A3D" stroke-width="3"/><circle cx="20" cy="20" r="4.5" fill="#FF8A3D"/></svg>

    <button id="btnSources" class="pill" title="Fontes de preço">Fontes</button>

  </div>
</header>

<aside id="panel" aria-live="polite">
  <div id="panelInner"></div>
</aside>

<div id="tooltip" role="tooltip"></div>
<div id="notes" hidden><div class="notes-h">Fala sugerida</div><div id="notesTxt"></div></div>

<nav id="nav">
  <button id="prev" class="navbtn" aria-label="Anterior">‹</button>
  <div id="dots"></div>
  <button id="next" class="navbtn" aria-label="Próximo">›</button>
</nav>
<div id="hint">← → navegar · arraste para girar · clique nos objetos</div>

<div id="modal" hidden>
  <div class="modal-card">
    <button class="modal-x" aria-label="Fechar">×</button>
    <div id="modalBody"></div>

</div>
<div id="loading"><div class="ld-sun"></div><div>Montando o prédio da Horizonte…</div></div>

/* ---------- gráfico de barras 3D reutilizável ---------- */
const CAT_COLOR = { 'Rede': 0xFF8A3D, 'Wi-Fi': 0x2EC4B6, 'Energia': 0xFFC94D, 'Dados': 0x5BD68A, 'Computadores': 0x4C8DFF, 'Sistemas': 0xB48CFF, 'Expedição': 0xFF6FA8 };
const chartPlays = new Map();
function disposeChart(g) {
  for (let i = labels.length - 1; i >= 0; i--) { let o = labels[i].obj; while (o && o !== g) o = o.parent; if (o === g) { labels[i].el.remove(); labels.splice(i, 1); } }
  for (let i = pickables.length - 1; i >= 0; i--) { let o = pickables[i]; while (o && o !== g) o = o.parent; if (o === g) pickables.splice(i, 1); }
  while (g.children.length) g.remove(g.children[0]);
}
function barChart(g, items, { gap = 2.2, w = 1.3, unit } = {}) {
  disposeChart(g);
  const n = items.length, start = -(n - 1) * gap / 2;
  const base = box(n * gap + .4, .1, w + 2.2, mat(0x0F1830, { roughness: .9 }), 0, -.05, .4); base.castShadow = false; g.add(base);
  const be = edges(base.geometry, 0x2A3B63, .8); be.position.copy(base.position); g.add(be);
  const bars = items.map((it, i) => {
    const grp = new THREE.Group(); grp.position.set(start + i * gap, 0, 0); g.add(grp);
    const inner = new THREE.Group(); grp.add(inner); inner.scale.y = .001;
    let y = 0; const meshes = [];
    (it.segs || [[it.value, it.color]]).forEach(([v, col]) => {
      const sh = Math.max(.04, v / unit); const geo = new THREE.BoxGeometry(w, sh, w); geo.translate(0, sh / 2 + y, 0);
      const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: .22, roughness: .35, metalness: .1 }));
      m.castShadow = true; inner.add(m); meshes.push(m); pickable(m, { tip: it.tip, onClick: it.onClick }); y += sh;
    });
    const top = new THREE.Object3D(); top.position.y = .4; grp.add(top);
    const topL = label('', top, { cls: 'val' }); topL.alpha = 0;
    const bot = new THREE.Object3D(); bot.position.set(0, 0, w / 2 + .5); grp.add(bot);
    const botL = label(it.name, bot, { cls: 'barname' });
    return { it, grp, inner, meshes, h: y, top, topL, botL };
  });
  return {
    bars,
    play(order = null, stagger = 330, dur = 850) {
      const token = {}; chartPlays.set(g, token);
      bars.forEach(b => { b.inner.scale.y = .001; b.top.position.y = .4; b.topL.alpha = 0; });
      (order || bars.map((_, i) => i)).forEach((bi, k) => setTimeout(() => {
        if (chartPlays.get(g) !== token) return;

  };
}

  },
  html: () => `<div class="kicker">Desafio 8 · Apresentação executiva</div><h2>Uma resposta para cada diretor</h2>
    <div class="tabs"><button class="on" data-t="dir">Diretoria</button><button data-t="rot">Roteiro e equipe</button><button data-t="qa">Perguntas difíceis</button></div>
    <div data-p="dir"><div class="cards">${PERSONAS.map(p => `<button class="card" data-per="${p.id}"><div class="t" style="color:${p.color}">${p.name}</div><div class="s">${p.role}</div></button>`).join('')}</div><div id="perDetail"><p class="small">Clique em um diretor, no painel ou na cena 3D.</p></div></div>
    <div data-p="rot" hidden><table><thead><tr><th>Bloco</th><th>Mensagem</th><th class="n">min</th></tr></thead><tbody>
      ${PRESENTERS.map((pr, k) => { const its = SCRIPT.filter(x => x.by === pr.id); return `<tr class="sub"><td colspan="2">${k + 1}. ${pr.name} <span class="muted">· ${pr.part}</span></td><td class="n">${String(sum(its, x => x.min)).replace('.', ',')}</td></tr>` + its.map(s => `<tr data-goto="${s.slide}" style="cursor:pointer"><td>${s.who}</td><td>${s.txt}</td><td class="n">${String(s.min).replace('.', ',')}</td></tr>`).join(''); }).join('')}
      <tr class="tot"><td colspan="2">Total (+ perguntas)</td><td class="n">${sum(SCRIPT, s => s.min)}</td></tr></tbody></table>
      <p class="small" style="margin-top:6px">Clique numa linha para ir ao slide. O cronômetro no topo marca o tempo (atalho T).</p></div>
    <div data-p="qa" hidden>${QA.map(q => `<details class="acc"><summary>${q.q}</summary><div>${q.a}</div></details>`).join('')}</div>`,
  bind(root) {
    $$('.tabs button', root).forEach(b => b.onclick = () => { $$('.tabs button', root).forEach(x => x.classList.toggle('on', x === b)); $$('[data-p]', root).forEach(p => p.hidden = p.dataset.p !== b.dataset.t); });
    $$('[data-per]', root).forEach(b => b.onclick = () => this.show(b.dataset.per));
    $$('tr[data-goto]', root).forEach(r => r.onclick = () => go_(+r.dataset.goto));
  },
  update(t) { Object.entries(this.p).forEach(([k, o], i) => { o.head.position.y = o.y + Math.sin(t * 1.6 + i) * .08 + (k === this.sel ? .25 : 0); o.ring.rotation.z = t * .5; }); },
  notes: 'Fechamos respondendo a cada diretor com a frase dele. Mariana: não trocamos tudo e cabemos no teto. Carlos: saldo real. Fernanda: PCs novos e backup testado. Roberto: o depósito vem primeiro. Deixamos as perguntas difíceis já preparadas.'
};

/* ---------- 13. ENCERRAMENTO ---------- */
const S_END = {
  chapter: 'Decisão', dot: '✓', tip: 'Encerramento', cover: true, building: 'final', sun: true, cam: [-25, 12, 25], target: [0, 3.5, 0],
  html: () => `<div class="kicker">Decisão pedida hoje</div><h1>Aprovar a <span class="hl">Onda 1</span></h1>
    <p class="lead">Rede, Wi-Fi, backup e PCs do financeiro: ${BRL(totals.o1)}, executados em 5 semanas, junto com a assinatura do contrato de suporte.</p>
    ${stats([[BRLk(totals.o12), 'Ondas 1+2 · dentro do teto'], [BRL(totals.opex), 'mensal recorrente'], ['8 KPIs', 'revisados na semana 24']])}
    <div class="row" style="justify-content:center"><button class="btn" data-go="1">Rever os desafios</button><button class="btn" id="srcBtn2">Ver fontes de preço</button><button class="btn primary" data-go="12">Perguntas</button></div>`,
  bind() { $('#srcBtn2').onclick = openSources; },
  update(t) { building.root.rotation.y = -t * .06; },
  exit() { building.root.rotation.y = 0; },
  notes: 'Pedido objetivo: aprovem a Onda 1 hoje. Em cinco semanas, a rede está estável, os arquivos protegidos e o financeiro com máquinas novas. Obrigado. Ficamos à disposição para perguntas.'
};

const SLIDES = [S_COVER, S_AGENDA, S_DIAG, S_CHAIN, S_PRIO, S_SOL, S_TOPO, S_ERP, S_MKT, S_BUD, S_IMP, S_RISK, S_DEF, S_END];

/* ============================================================
   NAVEGAÇÃO / LOOP
   ============================================================ */
let cur = -1;
const dotsEl = $('#dots');
SLIDES.forEach((s, i) => {
  const b = document.createElement('button'); b.className = 'dot';
  b.innerHTML = `${s.dot}<span class="tip">${s.tip}</span>`; b.onclick = () => go_(i); dotsEl.appendChild(b);
});

function renderPanel(s) {
  panelInner.innerHTML = s.html.call(s);
  $$('[data-go]', panelInner).forEach(b => b.onclick = () => go_(+b.dataset.go));
  s.bind && s.bind.call(s, panelInner);
}
function go_(i) {
  i = Math.max(0, Math.min(SLIDES.length - 1, i));
  if (i === cur) return;
  const prev = SLIDES[cur], s = SLIDES[i];
  if (prev) { prev.exit && prev.exit.call(prev); if (prev.group) fadeGroup(prev.group, false, 450); }
  cur = i;
  if (s.build && !s.group) s.build.call(s);
  if (s.group) { s.group.userData.k = 0; setOpacity(s.group, 0); fadeGroup(s.group, true, 700); }
  // prédio
  const BR = building.root;
  if (s.building) {
    if (!BR.userData.on) { BR.userData.on = true; building.setMode(s.building, !BR.visible); fadeGroup(BR, true, 700); }
    else building.setMode(s.building);
  } else if (BR.userData.on) { BR.userData.on = false; fadeGroup(BR, false, 450); }
  horizonSun.userData.target = s.sun ? 1 : 0;
  // painel
  const panel = $('#panel'); panelInner.classList.add('out');
  setTimeout(() => {
    panel.classList.toggle('cover', !!s.cover); panelSide = !s.cover; applyViewOffset();
    renderPanel(s); panelInner.scrollTop = 0; panelInner.classList.remove('out');
  }, cur === i && prev ? 220 : 0);
  if (!prev) { panel.classList.toggle('cover', !!s.cover); panelSide = !s.cover; applyViewOffset(); }
  const pr = presenterOf(i); $('#chapter').innerHTML = s.chapter + (pr ? ` <span class="presenter">· ${pr.name.split(' ')[0]}</span>` : '');
  $$('.dot', dotsEl).forEach((d, k) => d.classList.toggle('on', k === i));
  { const k = pr ? pr.slides.indexOf(i) + 1 : 0, nx = pr && PRESENTERS[PRESENTERS.indexOf(pr) + 1];
    $('#notesTxt').innerHTML = (pr ? `<div class="notes-who">${pr.name} · ${k} de ${pr.slides.length}${k === pr.slides.length && nx ? ` · depois: ${nx.name.split(' ')[0]}` : ''}</div>` : '') + `<div>${s.notes || ''}</div>` + (HANDOFF[i] ? `<div style="margin-top:8px"><b>Passagem:</b> ${HANDOFF[i]}</div>` : ''); }
  flyTo(s.cam, s.target, prev ? 1500 : 10);
  s.enter && s.enter.call(s);
  tooltip.classList.remove('on');
  try { history.replaceState(null, '', '#s' + i); } catch (e) { }
  if (i > 0 && !timer.started) startTimer();
}

/* ---------- cronômetro ---------- */
const timer = { started: false, t0: 0, acc: 0, running: false };
function startTimer() { timer.started = timer.running = true; timer.t0 = performance.now(); $('#btnTimer').classList.add('on'); }
function toggleTimer() { if (!timer.running) { timer.running = true; timer.started = true; timer.t0 = performance.now(); $('#btnTimer').classList.add('on'); } else { timer.acc += performance.now() - timer.t0; timer.running = false; $('#btnTimer').classList.remove('on'); } }
function tickTimer() {
  const ms = timer.acc + (timer.running ? performance.now() - timer.t0 : 0); const s = Math.floor(ms / 1000);
  $('#clock').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  $('#btnTimer').classList.toggle('over', s > 15 * 60);
}
$('#btnTimer').onclick = toggleTimer;
$('#btnTimer').ondblclick = () => { timer.acc = 0; timer.t0 = performance.now(); };

/* ---------- notas / fontes / tela cheia ---------- */
$('#btnNotes').onclick = () => { const n = $('#notes'); n.hidden = !n.hidden; $('#btnNotes').classList.toggle('on', !n.hidden); };
function openSources() {
  const used = new Set([...CAPEX.map(x => x.src), ...OPEX.map(x => x.src), 'amazon_nas', 'omie', 'vivo_loc', 'brother', 'sa8']);
  $('#modalBody').innerHTML = `<div class="kicker">Desafio 4 · Referências</div><h2>Fontes de preço (pesquisa em 16/11/2026)</h2>
    <p class="small">Valores de varejo variam diariamente; a compra deve ser precedida de 3 cotações. Composições públicas (ORSE, TRF1) servem de referência de mão de obra.</p>
    <ol style="padding-left:20px;font-size:13.5px">${[...used].map(k => `<li style="margin:5px 0">${srcLink(k)}</li>`).join('')}</ol>`;
  $('#modal').hidden = false;
}
$('#btnSources').onclick = openSources;
$('.modal-x').onclick = () => $('#modal').hidden = true;
$('#modal').onclick = e => { if (e.target.id === 'modal') $('#modal').hidden = true; };
$('#btnFull').onclick = () => { try { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); } catch (e) { } };
$('.brand').onclick = () => go_(0);
$('#prev').onclick = () => go_(cur - 1);
$('#next').onclick = () => go_(cur + 1);
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go_(cur + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go_(cur - 1); }
  else if (e.key === 'Home') go_(0); else if (e.key === 'End') go_(SLIDES.length - 1);
  else if (e.key.toLowerCase() === 'n') $('#btnNotes').click();
  else if (e.key.toLowerCase() === 't') toggleTimer();
  else if (e.key.toLowerCase() === 'f') $('#btnFull').click();
  else if (e.key === 'Escape') $('#modal').hidden = true;
});
addEventListener('hashchange', () => { const m = location.hash.match(/^#s(\d+)$/); if (m) go_(+m[1]); });

/* ---------- loop ---------- */
const clock = new THREE.Clock();
function frame(now) {
  const dt = Math.min(.05, clock.getDelta()), t = clock.elapsedTime;
  runTweens(now);
  controls.update();
  building.root.visible && building.update(t);
  const s = SLIDES[cur]; if (s && s.update) s.update.call(s, t, dt);
  const ht = horizonSun.userData.target ?? 0; horizonSun.material.opacity += (ht - horizonSun.material.opacity) * .09;
  renderer.render(scene, camera);
  updateLabels(); tickTimer();
  requestAnimationFrame(frame);
}
const m0 = location.hash.match(/^#s(\d+)$/);
go_(m0 ? +m0[1] : 0);
requestAnimationFrame(frame);
setTimeout(() => $('#loading').classList.add('done'), 300);
window.__go = go_;

</script>
</body>
</html>
